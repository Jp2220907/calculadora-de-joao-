<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de João</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculadora">
        <h1>Calculadora de João</h1>
        <p>Esta calculadora faz contas com vários números.</p>
        <p id="visor">0</p>
        <div class="teclado"> 
            <button class="limpar" id="botao-limpar">C</button>
    <button id="botao-divisao">/</button>
    <button id="botao-sete">7</button>
    <button id="botao-oito">8</button>
    <button id="botao-nove">9</button>
    <button id="botao-multiplicacao">*</button>
    <button id="botao-quatro">4</button>
    <button id="botao-cinco">5</button>
    <button id="botao-seis">6</button>
    <button id="botao-subtracao">-</button>
    <button id="botao-um">1</button>
    <button id="botao-dois">2</button>
    <button id="botao-tres">3</button>
    <button id="botao-adicao">+</button>
    <button id="botao-zero">0</button>
    <button id="botao-virgula">,</button>
    <button id="botao-igual">=</button>
    </div>
    </main>
    <script src="script.js"></script>
</body></html>
